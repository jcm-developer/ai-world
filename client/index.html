<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI World</title>
    <meta name="description" content="Experimentos con agentes de IA autónomos en mundos 3D." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%238cb8ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e6ecf5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/hub/hub.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <main class="hub">
      <header class="hub-header">
        <div class="wordmark">
          <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
            <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5" />
            <circle cx="16" cy="16" r="3" fill="currentColor" />
            <circle class="orbit-dot" cx="26" cy="16" r="1.6" fill="var(--accent)" />
          </svg>
          <span>AI World</span>
        </div>
        <span id="mode-chip" class="chip" hidden>Modo simulado</span>
      </header>

      <section class="intro">
        <p class="eyebrow">Elige un mundo</p>
        <h1>Mundos donde la IA <em>decide sola</em></h1>
        <p>Cada escenario es un experimento: un agente, o varios, percibe su entorno, razona y actúa sin que nadie le dé instrucciones. Tú solo miras.</p>
      </section>

      <section id="grid" class="grid" aria-label="Escenarios disponibles">
        <div class="loading">Cargando escenarios…</div>
      </section>

      <section class="upcoming-section" id="upcoming-section" hidden>
        <p class="eyebrow">Lo que viene</p>
        <ul id="upcoming" class="upcoming" aria-label="Próximos escenarios"></ul>
      </section>
    </main>

    <script type="module" src="/src/hub/main.js"></script>
  </body>
</html>
